name: ETF Daily Scanner - Indian Market Hours

on:
  schedule:
    # Schedule at 12:00 PM, 2:00 PM, 3:00 PM IST
    # Convert IST to UTC (IST = UTC+5:30)
    # 12:00 PM IST = 6:30 AM UTC
    # 2:00 PM IST = 8:30 AM UTC  
    # 3:00 PM IST = 9:30 AM UTC
    - cron: '30 6,8,9 * * 1-5'  # Mon-Fri at 6:30, 8:30, 9:30 UTC
  workflow_dispatch:  # Allow manual trigger
    inputs:
      custom_symbols:
        description: 'Custom ETF symbols (comma-separated)'
        required: false
        default: ''

jobs:
  scan-etfs:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
  # Add write permissions
    permissions:
      contents: write
      actions: read


   
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run ETF Scanner
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TZ: Asia/Kolkata
      run: |
        python run.py
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: etf-scanner-logs
        path: logs/
        retention-days: 7
